# По умолчанию встроенная H2 (запуск без настройки). Для Postgres задайте переменные окружения.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/migrenenet;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}

# Telegram и доступ (значения только из переменных окружения, в коде секретов нет)
telegram.token=${TELEGRAM_TOKEN:}
telegram.webapp-url=${WEBAPP_URL:}
doctor.chat-id=${DOCTOR_CHAT_ID:}
doctor.key=${DOCTOR_KEY:}
reminder.zone=${REMINDER_TZ:Europe/Moscow}
app.cors-origin=${CORS_ORIGIN:}
