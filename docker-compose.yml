services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: migrenenet, POSTGRES_USER: migren, POSTGRES_PASSWORD: change-me }
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/migrenenet
      DB_USER: migren
      DB_PASSWORD: change-me
volumes: { pgdata: {} }
