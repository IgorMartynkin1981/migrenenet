services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: migrenenet, POSTGRES_USER: migren, POSTGRES_PASSWORD: change-me }
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/migrenenet
      DB_USER: migren
      DB_PASSWORD: change-me
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      WEBAPP_URL: ${WEBAPP_URL:-}
      DOCTOR_CHAT_ID: ${DOCTOR_CHAT_ID:-}
      DOCTOR_KEY: ${DOCTOR_KEY:-}
      REMINDER_TZ: ${REMINDER_TZ:-Europe/Moscow}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
volumes: { pgdata: {} }
